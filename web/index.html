<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transworld RegisPro — registro y acreditación de eventos.">

  <!-- Barra superior del navegador / PWA (navy brand). -->
  <meta name="theme-color" content="#162B4C">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#162B4C">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#162B4C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transworld | RegisPro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Transworld | RegisPro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #162B4C;
    }
    #app-boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #162B4C;
      color: #E8EEF7;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      z-index: 9999;
    }
    #app-boot-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(232, 238, 247, 0.25);
      border-top-color: #B1F22A;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    #app-boot-splash .label {
      font-size: 14px;
      letter-spacing: 0.02em;
      opacity: 0.9;
    }
    #app-boot-splash .hint {
      display: none;
      max-width: 280px;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.75;
    }
    #app-boot-splash.slow .hint { display: block; }
    #app-boot-splash.slow .spinner { animation-duration: 1.2s; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-boot-splash" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="label">Cargando RegisPro…</div>
    <div class="hint">La carga está tardando. Si no avanza, recarga la página.</div>
  </div>
  <script>
    // Si el motor no pinta a tiempo, mostramos pista (sin forzar reload).
    setTimeout(function () {
      var el = document.getElementById('app-boot-splash');
      if (el) el.classList.add('slow');
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
